[project]
name = "blended"
version = "0.1.0"
description = "A compiler for Blender animations"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "certifi>=2024.2",
]

[project.scripts]
blended = "blended.cli:main"

# A dependency group, not an optional extra: `uv sync` installs groups by default but skips
# extras, so as an extra this left every fresh clone unable to run the tests that CLAUDE.md
# tells you to run.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Two top-level packages, deliberately separate. See CLAUDE.md.
#   blended          → host process, system Python, may use dependencies
#   blended_backend  → runs INSIDE Blender's Python, stdlib + bpy ONLY
packages = ["src/blended", "src/blended_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: launches a real Blender process (slow)"]
# `-rs` always: a skip and a pass look identical in the summary line, and the tests most
# likely to skip here are the ingestion ones — the area that has produced the subtlest bugs
# in this project. If coverage silently drops on a new machine, say so on every run.
addopts = "-rs"

[tool.ruff]
line-length = 100
target-version = "py313"
