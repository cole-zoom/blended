[project]
name = "blended"
version = "0.1.0"
description = "A compiler for Blender animations"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "certifi>=2024.2",
]

[project.scripts]
blended = "blended.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Two top-level packages, deliberately separate. See CLAUDE.md.
#   blended          → host process, system Python, may use dependencies
#   blended_backend  → runs INSIDE Blender's Python, stdlib + bpy ONLY
packages = ["src/blended", "src/blended_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: launches a real Blender process (slow)"]

[tool.ruff]
line-length = 100
target-version = "py313"
